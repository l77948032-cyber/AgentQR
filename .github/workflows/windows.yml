name: Windows QR scanner

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore windows/ScanBridge.Tests --locked-mode
      - name: Test actual Windows image decoding
        env:
          SCANBRIDGE_FIXTURES_DIR: ${{ runner.temp }}/scanbridge-fixtures
        run: dotnet test windows/ScanBridge.Tests -c Release --no-restore --logger "trx;LogFileName=windows.trx"
      - name: Publish self-contained application
        run: dotnet publish windows/ScanBridge -c Release -r win-x64 --self-contained true -o artifacts/windows-x64
      - name: Smoke test the published executable
        shell: pwsh
        run: |
          $exe = Resolve-Path artifacts/windows-x64/scanbridge.exe
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help failed' }
          $image = "$env:RUNNER_TEMP/scanbridge-fixtures/synthetic qr.png"
          $response = & $exe scan $image
          if ($LASTEXITCODE -ne 0) { throw 'Published app could not decode PNG' }
          $result = @($response | ConvertFrom-Json)
          if ($result.Count -ne 1 -or $result[0].kind -ne 'web') { throw 'Invalid decode result' }
          if ($response -match 'synthetic-only') { throw 'Default output leaked payload' }
          $response = & $exe scan $image --reveal
          if ($LASTEXITCODE -ne 0) { throw 'Reveal failed' }
          $result = @($response | ConvertFrom-Json)
          if ($result[0].payload -ne 'https://example.com/invoice?token=synthetic-only') { throw 'Wrong decoded payload' }
          $response = & $exe scan "$env:RUNNER_TEMP/nonexistent-qr.png"
          if ($LASTEXITCODE -ne 1) { throw 'Expected unreadable-image exit code' }
          if (($response | ConvertFrom-Json).error -ne 'SCAN_OR_OPEN_FAILED') { throw 'Invalid error JSON' }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: scanbridge-windows-x64
          path: artifacts/windows-x64/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: windows/ScanBridge.Tests/TestResults/*.trx
          if-no-files-found: ignore
