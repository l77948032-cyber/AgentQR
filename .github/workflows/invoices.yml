name: Invoice workflow

on:
  push:
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'Tests/test_*.py'
      - 'integrations/dsh/**'
      - '.github/workflows/invoices.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoice-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/agentqr/scripts/requirements-invoices.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm run check
        working-directory: integrations/dsh
